# SonarCloud automatic analysis settings.

# The PHPUnit bootstrap stubs WordPress functions, so it must use WordPress's
# snake_case names and signatures (unused parameters, empty bodies included).
sonar.exclusions=tests/bootstrap.php

# Test data providers list cases of the same shape on purpose; the copy-paste
# detection reads them as duplicated code. Other rules still apply to tests.
sonar.cpd.exclusions=tests/**
